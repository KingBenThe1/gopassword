<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Password Generator</title>
</head>
<body>
    <header>
        <h1>Password Generator</h1>
    </header>
    <main>
        <form action="/submit" method="POST">
            <div title="length">
                <label for="length">Password Length:</label>
                <input type="number" id="length" name="length" placeholder="Enter password length" required>
            </div>
            <br>
            <div title="upper">
                <label for="uppercaseCheckbox">Include Uppercase:</label>
                <input type="checkbox" id="uppercaseCheckbox" name="uppercaseCheckbox">
                <label for="uppercaseCount">Number of Uppercase:</label>
                <input type="number" id="uppercaseCount" name="uppercaseCount" placeholder="Number of uppercase">
            </div>
            <div title="specialc">
                <label for="specialcCheckbox">Include Special Characters:</label>
                <input type="checkbox" id="specialcCheckbox" name="specialcCheckbox">
                <label for="specialcCount">Number of Special Characters:</label>
                <input type="number" id="specialcCount" name="specialcCount" placeholder="Number of special characters">
            </div>
            <div title="number">
                <label for="numberCheckbox">Include Numbers:</label>
                <input type="checkbox" id="numberCheckbox" name="numberCheckbox">
                <label for="numberCount">Number of Numbers:</label>
                <input type="number" id="numberCount" name="numberCount" placeholder="Number of numbers">
            </div>
            <div title="submit">
                <button type="submit" id="submit">Generate Password</button>
            </div>
        </form>
    </main>
</body>
</html>
